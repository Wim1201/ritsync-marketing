<!doctype html>
<html lang="nl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vuurwerk voor Modus — RitSync is live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Vuurwerk voor Modus — bedankfilm, ±31,5 s
   Geen stem, geen muziek: alleen vuurwerkgeluid (assets/vuurwerk.mp3,
   op maat gemonteerd; de knal-tijden staan in BOOMS hieronder en
   lopen gelijk met het geluidsspoor).
   Vijf tekstregels lichten op als vuurwerkletters; opbouw en
   afbouw met het accent op regel 3 (RitSync is live !!).
   ============================================================ */
:root{
  --navy:#002F50;--navy-d:#001625;--orange:#FF8B00;--gold:#FFD766;
}
*{box-sizing:border-box}
html,body{margin:0;background:#04121f;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:14px}
.wrap{width:min(100%,420px)}
.stage{
  position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:24px;
  background:radial-gradient(140% 90% at 50% 110%, #0A4A7A 0%, #002F50 45%, #001625 100%);
  box-shadow:0 20px 60px #0008;container-type:inline-size;
}
canvas{position:absolute;inset:0;width:100%;height:100%}

/* geleidelijk oplichten en weer dimmen */
#dim{position:absolute;inset:0;background:#000;opacity:.68;pointer-events:none;transition:opacity 2.5s ease}

/* ---- feestaankleding ---- */
#deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.balloon{transform-box:fill-box;transform-origin:center bottom;animation:sway 5.2s ease-in-out infinite}
.balloon:nth-of-type(2){animation-delay:-1.6s}
.balloon:nth-of-type(3){animation-delay:-3.1s}
.balloon:nth-of-type(4){animation-delay:-2.2s}
@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
.stage.feest .balloon{animation-duration:1.6s}
.garland{transform-box:fill-box;transform-origin:center top;animation:sway 7s ease-in-out infinite}

/* ---- de vijf tekstregels ---- */
.lijn{
  position:absolute;left:6cqw;right:6cqw;text-align:center;
  font-weight:800;color:#fff;opacity:0;transform:scale(.92);
  transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease,text-shadow 1.6s ease;
}
.lijn.aan{opacity:1;transform:scale(1)}
/* gloeien -> branden -> nagloeien */
.lijn.aan{
  text-shadow:0 0 6px rgba(255,180,60,.8),0 0 18px rgba(255,139,0,.55),0 0 40px rgba(255,110,0,.3);
  animation:flakker 1.1s ease-in-out infinite;
}
@keyframes flakker{
  0%,100%{text-shadow:0 0 6px rgba(255,190,80,.85),0 0 18px rgba(255,139,0,.55),0 0 40px rgba(255,110,0,.3)}
  50%{text-shadow:0 0 9px rgba(255,220,120,.95),0 0 26px rgba(255,150,0,.7),0 0 56px rgba(255,120,0,.45)}
}
.lijn.uitgegloeid{
  animation:none;color:#f4c48f;
  text-shadow:0 0 4px rgba(255,160,60,.4),0 0 12px rgba(255,120,0,.18);
}
#l1{top:17cqw;font-size:6.6cqw;letter-spacing:.02em}
#l2{top:34cqw;font-size:7.6cqw}
#l3{top:58cqw;font-size:12.5cqw;font-weight:900;line-height:1.06;color:#FFD766}
#l3.aan{
  animation:blaas 0.9s ease-in-out infinite;
}
@keyframes blaas{
  0%,100%{text-shadow:0 0 10px rgba(255,225,130,1),0 0 30px rgba(255,150,0,.9),0 0 70px rgba(255,110,0,.6),0 3px 2px rgba(120,40,0,.6)}
  50%{text-shadow:0 0 16px rgba(255,240,170,1),0 0 46px rgba(255,170,20,1),0 0 100px rgba(255,120,0,.8),0 3px 2px rgba(120,40,0,.6)}
}
#l4{top:94cqw;font-size:6.2cqw;font-weight:600;color:#ffe9cf}
#l5{top:131cqw;font-size:6.2cqw;color:#fff}
#l5 .sync{color:var(--orange)}

/* biertjes bij regel 4 */
#bier{position:absolute;top:112cqw;left:0;right:0;display:flex;justify-content:center;gap:3cqw;opacity:0;transition:opacity 1.4s ease}
#bier.aan{opacity:1}
#bier svg{width:7cqw;height:auto}

/* logo op de slotregel */
#slotlogo{position:absolute;top:142cqw;left:50%;transform:translateX(-50%) scale(.9);width:23cqw;opacity:0;transition:opacity 1.8s ease,transform 1.8s ease}
#slotlogo.aan{opacity:1;transform:translateX(-50%) scale(1)}

/* late-knal flits */
#flits{position:absolute;inset:0;background:radial-gradient(80% 60% at 78% 22%,rgba(255,230,170,.85),rgba(255,150,0,.25) 45%,transparent 70%);opacity:0;pointer-events:none}
#flits.aan{animation:flits .9s ease-out both}
@keyframes flits{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

/* ---- bediening ---- */
.controls{display:flex;gap:10px;align-items:center;margin-top:10px}
.track{height:4px;flex:1;background:#ffffff33;border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--orange)}
button{border:0;border-radius:999px;background:var(--orange);color:#09243a;font-weight:800;padding:9px 15px;cursor:pointer}
.startover{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(0,15,26,.6);backdrop-filter:blur(2px);transition:opacity .35s ease;
}
.startover.hidden{opacity:0;pointer-events:none}
.startover button{font-size:16px;padding:14px 28px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.startover span{font-size:12.5px;font-weight:600;color:#cfe3f2}
@media (prefers-reduced-motion:reduce){
  .lijn,.balloon,.garland{animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<div class="stage" id="stage">
  <canvas id="fx"></canvas>
  <div id="dim"></div>

  <svg id="deco" viewBox="0 0 390 694" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <!-- slingers in de bovenhoeken -->
    <g class="garland" opacity=".9">
      <path d="M-10 26 Q60 78 150 44 Q240 12 300 58 Q350 92 400 60" fill="none" stroke="#FF8B00" stroke-width="3"/>
      <g fill="#FFD766"><circle cx="42" cy="52" r="5"/><circle cx="118" cy="57" r="5"/><circle cx="196" cy="32" r="5"/><circle cx="272" cy="42" r="5"/><circle cx="340" cy="74" r="5"/></g>
      <g fill="#2E73C8"><circle cx="80" cy="60" r="4"/><circle cx="158" cy="44" r="4"/><circle cx="236" cy="30" r="4"/><circle cx="308" cy="60" r="4"/></g>
    </g>
    <!-- ballonnen -->
    <g class="balloon"><ellipse cx="34" cy="580" rx="20" ry="26" fill="#FF8B00"/><path d="M34 606 q4 8 0 16 q-4 8 0 16" stroke="#ffffff88" fill="none" stroke-width="1.6"/></g>
    <g class="balloon"><ellipse cx="360" cy="560" rx="18" ry="24" fill="#2E73C8"/><path d="M360 584 q4 8 0 16 q-4 8 0 16" stroke="#ffffff88" fill="none" stroke-width="1.6"/></g>
    <g class="balloon"><ellipse cx="66" cy="640" rx="16" ry="21" fill="#19A05B"/><path d="M66 661 q4 7 0 14 q-4 7 0 14" stroke="#ffffff88" fill="none" stroke-width="1.6"/></g>
    <g class="balloon"><ellipse cx="330" cy="648" rx="15" ry="20" fill="#FFD766"/><path d="M330 668 q4 7 0 14" stroke="#ffffff88" fill="none" stroke-width="1.6"/></g>
  </svg>

  <div class="lijn" id="l1">Het volgende ritje<br>is voor jullie</div>
  <div class="lijn" id="l2">Gefeliciteerd Modus</div>
  <div class="lijn" id="l3">RitSync<br>is live !!</div>
  <div class="lijn" id="l4">Pak er een en stuur ons een tikkie</div>
  <div id="bier"></div>
  <div class="lijn" id="l5">De mannen van Rit<span class="sync">Sync</span>.</div>
  <img id="slotlogo" src="assets/ritsync-logo-donker.svg" alt="RitSync">

  <div id="flits"></div>

  <div class="startover" id="startOverlay">
    <button id="startBtn" type="button">▶&nbsp;&nbsp;Steek de lont aan</button>
    <span>een halve minuut vuurwerk · zet je geluid aan</span>
  </div>
</div>
<div class="controls"><button id="replay">Opnieuw</button><div class="track"><i id="prog"></i></div></div>
<audio id="knal" src="assets/vuurwerk.mp3" preload="auto"></audio>
</div>
<script>
(()=>{
 const q=s=>document.querySelector(s);
 const stage=q('#stage'), cv=q('#fx'), ctx=cv.getContext('2d');
 const dim=q('#dim'), prog=q('#prog'), replay=q('#replay');
 const audio=q('#knal'), overlay=q('#startOverlay'), startBtn=q('#startBtn');
 const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const DUR=31500;
 let raf=null,t0=0,cursor=0,boomIdx=0,parts=[],confetti=[],rockets=[],running=false;

 /* knal-tijden: identiek aan het geluidsspoor (maak_vuurwerk.py) */
 const BOOMS=[[4.6,.35],[6.9,.45],[8.4,.5],[9.3,.5],[10.8,.58],[11.5,.6],
  [12.2,1],[12.8,.7],[13.4,1],[13.9,.75],[14.5,.9],[15.1,1],[15.7,.8],
  [16.3,1],[16.9,.85],[17.4,.9],[18.1,1],[18.8,.8],[19.4,.9],
  [20.6,.55],[21.9,.45],[23.4,.33],[24.8,.22],[29.3,.95]];
 const KLEUREN=['#FFB020','#FF8B00','#FFD766','#FFFFFF','#7FD0FF','#8DE8B7'];
 /* vaste plekken zodat het beeld gevuld maar niet rommelig raakt */
 const PLEK=[[.5,.34],[.24,.26],[.76,.24],[.32,.40],[.68,.38],[.18,.32],[.82,.34],
             [.42,.22],[.60,.28],[.28,.18],[.72,.18],[.50,.24]];

 function resize(){
   const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
   cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);
   cv._w=r.width;cv._h=r.height;
 }
 addEventListener('resize',resize);resize();

 function explode(x,y,size){
   const n=Math.round(50+70*size), kleur=KLEUREN[Math.floor(Math.random()*KLEUREN.length)];
   for(let i=0;i<n;i++){
     const a=Math.random()*Math.PI*2, v=(0.35+Math.random()*0.65)*(90+130*size);
     parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.9+Math.random()*0.9,
                 t:0,c:Math.random()<.75?kleur:'#FFFFFF',r:1.1+Math.random()*1.6});
   }
 }
 function rocket(tx,ty,eta){
   rockets.push({x:tx+(Math.random()*30-15),y:cv._h+10,tx,ty,eta,t:0});
 }
 function confettiBurst(n){
   for(let i=0;i<n;i++)
     confetti.push({x:Math.random()*cv._w,y:-10-Math.random()*40,
       vy:35+Math.random()*45,vx:Math.random()*24-12,rot:Math.random()*6.3,
       vr:Math.random()*4-2,c:KLEUREN[i%KLEUREN.length],w:3+Math.random()*4,h:6+Math.random()*5,t:0});
 }

 function tekenen(dt,tSec){
   ctx.clearRect(0,0,cv._w,cv._h);
   /* lontvonkje in fase 1 */
   if(tSec<5.6&&running){
     const p=tSec/5.6, lx=cv._w*(0.08+0.84*p), ly=cv._h*0.955;
     ctx.fillStyle='#FFE9A0';ctx.beginPath();ctx.arc(lx,ly,2.6,0,7);ctx.fill();
     for(let i=0;i<3;i++){
       ctx.fillStyle=Math.random()<.5?'#FFD766':'#FF8B00';
       ctx.fillRect(lx+Math.random()*14-7,ly+Math.random()*10-6,1.6,1.6);
     }
     ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.4;
     ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(cv._w*0.94,ly);ctx.stroke();
   }
   rockets=rockets.filter(r=>{
     r.t+=dt;const p=Math.min(r.t/r.eta,1);
     const x=r.x+(r.tx-r.x)*p, y=r.y+(r.ty-r.y)*(p*p*(3-2*p));
     ctx.strokeStyle='rgba(255,214,102,.8)';ctx.lineWidth=1.6;
     ctx.beginPath();ctx.moveTo(x,y+12);ctx.lineTo(x+Math.sin(r.t*30)*1.5,y);ctx.stroke();
     return p<1;
   });
   parts=parts.filter(p=>{
     p.t+=dt;if(p.t>p.life)return false;
     p.vy+=95*dt;p.vx*=0.985;p.vy*=0.992;
     p.x+=p.vx*dt;p.y+=p.vy*dt;
     ctx.globalAlpha=Math.max(0,1-p.t/p.life);
     ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
     return true;
   });
   confetti=confetti.filter(c=>{
     c.t+=dt;c.y+=c.vy*dt;c.x+=c.vx*dt+Math.sin(c.t*4+c.rot)*0.6;c.rot+=c.vr*dt;
     if(c.y>cv._h+12)return false;
     ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
     ctx.globalAlpha=.9;ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();
     return true;
   });
   ctx.globalAlpha=1;
 }

 const cues=[
  {t:300,run:()=>{dim.style.opacity='.62';q('#l1').classList.add('aan')}},
  {t:6300,run:()=>{dim.style.opacity='.42';q('#l2').classList.add('aan');q('#l1').classList.add('uitgegloeid')}},
  {t:12100,run:()=>{dim.style.opacity='.10';stage.classList.add('feest');
                    q('#l3').classList.add('aan');q('#l2').classList.add('uitgegloeid');
                    confettiBurst(90)}},
  {t:15500,run:()=>confettiBurst(60)},
  {t:20300,run:()=>{dim.style.opacity='.34';stage.classList.remove('feest');
                    q('#l4').classList.add('aan');q('#l3').classList.add('uitgegloeid')}},
  {t:21600,run:()=>q('#bier').classList.add('aan')},
  {t:26400,run:()=>{dim.style.opacity='.44';q('#l5').classList.add('aan');q('#l4').classList.add('uitgegloeid')}},
  {t:27200,run:()=>q('#slotlogo').classList.add('aan')},
  {t:29300,run:()=>q('#flits').classList.add('aan')}
 ];

 let last=0;
 function tick(now){
   const el=now-t0, tSec=el/1000, dt=Math.min((now-last)/1000,.05);last=now;
   while(cursor<cues.length&&cues[cursor].t<=el)cues[cursor++].run();
   while(boomIdx<BOOMS.length&&BOOMS[boomIdx][0]<=tSec+0.55){
     const [bt,size]=BOOMS[boomIdx];
     const [px,py]=PLEK[boomIdx%PLEK.length];
     if(bt>=29){ /* late knal: alleen de flits, buiten beeld */ }
     else if(bt<=tSec){explode(cv._w*px,cv._h*py,size);}
     else{rocket(cv._w*px,cv._h*py,bt-tSec);setTimeout(()=>explode(cv._w*px,cv._h*py,size),(bt-tSec)*1000);}
     boomIdx++;
   }
   if(!reduced)tekenen(dt,tSec);
   prog.style.width=Math.min(el/DUR*100,100)+'%';
   if(el<DUR)raf=requestAnimationFrame(tick);else running=false;
 }
 function reset(){
   document.querySelectorAll('.lijn').forEach(l=>l.classList.remove('aan','uitgegloeid'));
   q('#bier').classList.remove('aan');q('#slotlogo').classList.remove('aan');
   q('#flits').classList.remove('aan');stage.classList.remove('feest');
   dim.style.opacity='.68';parts=[];confetti=[];rockets=[];
   cursor=0;boomIdx=0;prog.style.width='0';
   audio.pause();audio.currentTime=0;
 }
 function play(){
   if(raf)cancelAnimationFrame(raf);reset();resize();
   running=true;audio.play();
   t0=performance.now();last=t0;raf=requestAnimationFrame(tick);
 }
 startBtn.addEventListener('click',()=>{overlay.classList.add('hidden');play()});
 replay.addEventListener('click',play);

 /* biertjes tekenen (klein, zes stuks) */
 const bier=q('#bier');
 for(let i=0;i<6;i++){
   bier.insertAdjacentHTML('beforeend',
   `<svg viewBox="0 0 24 32" aria-hidden="true">
      <rect x="4" y="8" width="14" height="21" rx="3" fill="#FFB020"/>
      <rect x="4" y="8" width="14" height="6" rx="3" fill="#FFF3D6"/>
      <path d="M18 12 q5 1 4 6 q-1 5 -5 4" fill="none" stroke="#FFE9C0" stroke-width="2.4"/>
    </svg>`);
 }
})();
</script>
</body>
</html>
