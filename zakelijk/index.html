<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RitSync — animatie v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RitSync — animatie v3  (ca. 54 seconden)

   Bedoeld als vervanger van de hero-mockup op de landingspagina.
   Plaatsnamen, tagline en dagketen volgen claude_ritsync-landingspagina.html.

     SC1  agenda + classificatie
     SC2  dagketen dinsdag: kantoor-anker en woon-werk
     SC3  overnachting Maastricht -> Keulen: de keten die doorloopt
     SC4  twijfelcontrole
     SC5  export PDF / Excel / CSV
     END  eindkaart met uitnodiging

   Kilometertarief 2026: EUR 0,25 (verhoogd van 0,23, terugwerkend
   tot 01-01-2026). Zie TARIEF in het script.
   Alle timing staat in de CUES-array onderaan.
   ============================================================ */

:root{
  --navy-900:#002F50;
  --navy-600:#013A63;
  --orange:#FF8B00;
  --paper:#FFFFFF;
  --paper-mute:#F1F5F9;
  --steel:#B9C4D1;
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#001B2E;font-family:var(--font-ui);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:16px;
}
.player{width:100%;max-width:390px}
.stage{
  position:relative;width:100%;aspect-ratio:390/700;
  border-radius:18px;overflow:hidden;background:var(--navy-900);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}
.stage svg{display:block;width:100%;height:100%}

.subtitle{
  position:absolute;left:0;right:0;bottom:0;padding:14px 18px 18px;
  background:linear-gradient(to top,rgba(0,20,35,.94),rgba(0,20,35,0));
  font-size:14px;line-height:1.35;font-weight:500;text-align:center;
  min-height:74px;display:flex;align-items:flex-end;justify-content:center;
}
.subtitle span{transition:opacity .22s ease}
.subtitle.swap span{opacity:0}

.bar{display:flex;align-items:center;gap:12px;margin-top:12px}
.track{flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--orange)}
button{
  font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--navy-900);
  background:var(--orange);border:0;border-radius:999px;padding:9px 18px;cursor:pointer;
}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* Buitenste <g> houdt de positie in een transform-ATTRIBUUT,
   binnenste <g> wordt door CSS bewogen. Nooit beide op één node. */
.anim{
  opacity:0;
  transition:opacity .42s ease, transform .5s cubic-bezier(.2,.8,.3,1);
  transform-box:fill-box;transform-origin:center;
}
.anim.on{opacity:1;transform:none}
.slide-in{transform:translateX(24px)}
.pop{transform:scale(.55)}
.rise{transform:translateY(16px)}
.drop{transform:translateY(-14px)}
.ejected{
  opacity:0!important;transform:translateY(80px) rotate(14deg)!important;
  transition:opacity .55s ease,transform .55s cubic-bezier(.5,-.4,.7,1);
}
.car{opacity:0;transition:opacity .3s ease}
.car.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  .anim{transition:opacity .18s linear}
  .anim,.slide-in,.pop,.rise,.drop{transform:none}
}
</style>
</head>

          <text x="195" y="493" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">7 JAAR</text>
          <rect x="234" y="476" width="60" height="26" rx="13" fill="#fff" fill-opacity=".12"/>
          <text x="264" y="493" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">PWA</text>
        </g>
      </g>

      <!-- ══════════ EINDKAART ══════════ -->
      <g id="end" class="anim">
        <rect width="390" height="700" fill="#002F50" opacity=".97"/>
        <g id="endInner" class="anim rise">
          <text x="195" y="306" font-size="42" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing=".5">Rit<tspan fill="#FF8B00">Sync</tspan></text>
          <text x="195" y="338" font-size="15" font-weight="500" fill="#B9C4D1" text-anchor="middle">Je agenda rijdt, RitSync telt.</text>
          <rect x="115" y="372" width="160" height="1.5" fill="#FF8B00" opacity=".5"/>
          <text x="195" y="402" font-size="12.5" font-weight="700" fill="#FF8B00" text-anchor="middle">Een maand gratis, op persoonlijke uitnodiging.</text>
          <text x="195" y="424" font-size="11.5" font-weight="500" fill="#B9C4D1" text-anchor="middle">Voor de eerste honderd testers.</text>
        </g>
      </g>
    </svg>

    <div class="subtitle" id="sub" aria-live="polite"><span></span></div>
  </div>

  <div class="bar">
    <button id="replay" type="button">Opnieuw afspelen</button>
    <div class="track"><i id="prog"></i></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const svg     = document.getElementById('film');
  const subBox  = document.getElementById('sub');
  const subText = subBox.querySelector('span');
  const prog    = document.getElementById('prog');
  const replay  = document.getElementById('replay');
  const kmTotal = document.getElementById('kmTotal');
  const euroTot = document.getElementById('euroTotal');

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Kilometertarief 2026: verhoogd naar EUR 0,25 met terugwerkende kracht
  // vanaf 01-01-2026. Geldt ook voor IB-ondernemers (ZZP).
  const TARIEF = 0.25;

  const ROUTES = ['route1','route3','route3b'].map(id => {
    const el = document.getElementById(id);
    return { el: el, len: el.getTotalLength(), dashed: id === 'route3b' };
  });
  function resetRoutes(){
    ROUTES.forEach(r => {
      r.el.style.strokeDasharray  = r.dashed ? '7 7' : r.len;
      r.el.style.strokeDashoffset = r.len;
    });
  }

  const show = sel => document.querySelectorAll(sel).forEach(n => n.classList.add('on'));
  const hide = sel => document.querySelectorAll(sel).forEach(n => n.classList.remove('on'));

  function say(text){
    subBox.classList.add('swap');
    setTimeout(() => { subText.textContent = text; subBox.classList.remove('swap'); }, reduced ? 0 : 180);
  }

  // Nederlandse notatie: komma als decimaalteken, punt als duizendtal
  function nl(n, dec){
    const s = n.toFixed(dec);
    const parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return parts.join(',');
  }

  // Laat de auto de route rijden terwijl de lijn zichzelf tekent.
  function drive(pathId, carId, duration){
    const path = document.getElementById(pathId);
    const car  = document.getElementById(carId);
    const len  = path.getTotalLength();
    car.classList.add('on');
    const t0 = performance.now();
    (function step(now){
      const p = Math.min((now - t0) / duration, 1);
      const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;   // easeInOutQuad
      path.style.strokeDashoffset = len * (1 - e);
      const a = path.getPointAtLength(len * e);
      const b = path.getPointAtLength(Math.min(len * e + 1, len));
      const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      car.setAttribute('transform', 'translate(' + a.x + ',' + a.y + ') rotate(' + ang + ')');
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  // Onthult de stippellijn van de volgende ochtend, zonder auto.
  function draw(pathId, duration){
    const path = document.getElementById(pathId);
    const len  = path.getTotalLength();
    const t0 = performance.now();
    (function step(now){
      const p = Math.min((now - t0) / duration, 1);
      path.style.strokeDashoffset = len * (1 - p);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function countUp(km, duration){
    const t0 = performance.now();
    (function step(now){
      const p = Math.min((now - t0) / duration, 1);
      const e = 1 - Math.pow(1 - p, 3);
      kmTotal.textContent = nl(km * e, 1) + ' km';
      euroTot.textContent = '€ ' + nl(km * e * TARIEF, 2);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  /* ══════════════ TIJDLIJN ══════════════
     t = milliseconden vanaf de start.
     on / off = CSS-selectors · sub = ondertitel · run = eigen functie.
     Hertimen doe je hier; verder hoeft er niets te veranderen.
  ══════════════════════════════════════ */
  const CUES = [
    /* SC1 — agenda */
    { t:     0, on:'#mark,#sc1', sub:'Dinsdag 15 september. Zes regels in je agenda.' },
    { t:   700, on:'#ap1' },
    { t:   980, on:'#ap2' },
    { t:  1260, on:'#ap3' },
    { t:  1540, on:'#ap4' },
    { t:  1820, on:'#ap5' },
    { t:  2100, on:'#ap6', sub:'Zes keer straks bedenken hoeveel kilometer dat ook alweer was.' },
    { t:  3400, on:'#engine', sub:'RitSync leest ze zelf. 203 herkenningsregels, en bij twijfel de AI erbij.' },
    { t:  4300, on:'#tg1' },
    { t:  4520, on:'#tg2' },
    { t:  4740, on:'#tg3' },
    { t:  4960, on:'#tg4' },
    { t:  5180, on:'#tg5' },
    { t:  5450, on:'#tg6', sub:'Zakelijk, intern, woon-werk, privé. Zonder dat jij iets aanvinkt.' },
    { t:  7000, sub:'De tandarts doet twee keer pijn: die kilometers zijn ook nog eens niet aftrekbaar.' },

    /* SC2 — dagketen dinsdag */
    { t:  8800, off:'#sc1', on:'#sc2', sub:'De rest wordt één dagketen.' },
    { t:  9300, on:'#p1home' },
    { t:  9530, on:'#p1office' },
    { t:  9760, on:'#p1a' },
    { t:  9990, on:'#p1b' },
    { t: 10220, on:'#p1c' },
    { t: 10550, on:'#p1p' },
    { t: 11150, on:'#stamp', sub:'Privé gaat eruit. Automatisch.' },
    { t: 11850, run:() => document.getElementById('p1p').classList.add('ejected') },
    { t: 12500, sub:'Thuis, kantoor, Amsterdam, terug langs kantoor, Rotterdam, Utrecht, thuis.' },
    { t: 13000, run:() => drive('route1','car1', reduced ? 500 : 7600) },
    { t: 15000, on:'#co1', sub:'Even langs kantoor tussen twee afspraken? Dat is een schakel in de keten.' },
    { t: 17200, sub:'Geen losse rit die je later niet meer kunt verantwoorden.' },
    { t: 18900, off:'#co1' },
    { t: 19300, on:'#co2', sub:'En die eerste rit naar kantoor is woon-werk.' },
    { t: 20800, sub:'Zakelijk voor de inkomstenbelasting, privé voor de btw. RitSync houdt dat apart.' },
    { t: 22600, sub:'Dinsdag: 222,9 kilometer, van deur tot deur onderbouwd.' },

    /* SC3 — overnachting */
    { t: 24400, off:'#sc2,#co2', on:'#sc3', sub:'Woensdag. Klant in Maastricht.' },
    { t: 24900, on:'#p3home' },
    { t: 25200, on:'#p3klant' },
    { t: 25600, run:() => drive('route3','car3', reduced ? 400 : 3400) },
    { t: 28200, on:'#p3hotel', sub:'En je rijdt niet terug.' },
    { t: 29400, sub:'De keten sluit vandaag niet. Hij loopt door tot morgenochtend.' },
    { t: 30800, on:'#p3keulen', run:() => draw('route3b', reduced ? 300 : 2000),
                sub:'Donderdag tien uur in Keulen. Daarna pas naar huis.' },
    { t: 32800, on:'#co3', sub:'Je dag begint bij het hotel, niet bij je voordeur.' },
    { t: 34400, sub:'Precies zoals je het aan de Belastingdienst zou uitleggen.' },

    /* SC4 — twijfelcontrole */
    { t: 36400, off:'#sc3,#co3', on:'#sc4', sub:'En als RitSync het écht niet weet?' },
    { t: 37400, on:'#opt1' },
    { t: 37650, on:'#opt2' },
    { t: 38200, sub:'Dan gokt het niet. Dan vraagt het.' },
    { t: 39800, on:'#optPick' },
    { t: 40300, on:'#optNote', sub:'Eén tik. En de volgende keer weet het systeem het zelf.' },

    /* SC5 — export */
    { t: 42800, off:'#sc4', on:'#sc5', sub:'Eind van de maand: één knop.' },
    { t: 43400, on:'#doc1' },
    { t: 43900, on:'#doc2', sub:'PDF voor je accountant. Excel voor jezelf.' },
    { t: 45100, on:'#totals', run:() => countUp(1284.6, reduced ? 300 : 1600) },
    { t: 46600, sub:'1.284,6 kilometer, tegen het tarief van 2026: € 0,25 per kilometer.' },
    { t: 48400, on:'#chips', sub:'Zeven jaar bewaarplicht? Staat er al in. En de app staat op je telefoon.' },

    /* Eindkaart */
    { t: 50800, off:'#sc5', on:'#end', sub:'' },
    { t: 51300, on:'#endInner' },
    { t: 54000, run:() => { replay.style.visibility = 'visible'; } }
  ];

  const DURATION = 54000;
  let cursor = 0, t0 = 0, raf = null;

  function apply(c){
    if (c.off) hide(c.off);
    if (c.on)  show(c.on);
    if (c.sub !== undefined) say(c.sub);
    if (c.run) c.run();
  }

  function tick(now){
    const elapsed = now - t0;
    while (cursor < CUES.length && CUES[cursor].t <= elapsed) apply(CUES[cursor++]);
    prog.style.width = Math.min(elapsed / DURATION * 100, 100) + '%';
    if (elapsed < DURATION) raf = requestAnimationFrame(tick);
  }

  function play(){
    if (raf) cancelAnimationFrame(raf);
    svg.querySelectorAll('.anim').forEach(n => n.classList.remove('on','ejected'));
    show('#sc1chrome,#sc4chrome');                 // scene chrome hoort altijd aan te staan
    svg.querySelectorAll('.car').forEach(c => { c.classList.remove('on'); c.removeAttribute('transform'); });
    kmTotal.textContent = '0,0 km';
    euroTot.textContent = '€ 0,00';
    subText.textContent = '';
    resetRoutes();
    cursor = 0;
    replay.style.visibility = 'hidden';
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }

  replay.addEventListener('click', play);
  play();
})();
</script>
</body>
</html>
