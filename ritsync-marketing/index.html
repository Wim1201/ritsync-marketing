<title>RitSync — tekenfilm v5</title>
<style>
/* ============================================================
   RitSync tekenfilm v5 — ca. 58 seconden

   Correcties t.o.v. de proefversie:
   - Privé-kilometers worden NIET geregistreerd (was een foute
     regel in het eindrapport)
   - Categorie "intern" toegevoegd (RitSync kent er vier)
   - Nieuwe scène: overnachting Maastricht -> Keulen
   - Plaatsnamen gelijkgetrokken met de landingspagina
   - Kilometers consistent: dag 141,8 km / maand 1.284,6 km
   - Tarief 2026: EUR 0,25 per kilometer

   Scènes: 1 Mark · 2 agenda's · 3 dagketen · 4 classificatie
           5 overnachting · 6 twijfel · 7 rapport · eind
   Alle timing staat in de cues-array onderaan.
   ============================================================ */
:root{
  --navy:#002F50;--navy2:#064a78;--orange:#ff8b00;--cream:#fff7e7;
  --green:#19a05b;--red:#df4a4a;--blue:#2e73c8;--ink:#17324a;--muted:#6e7f8f;
  --card:#fff;--line:#d9e2e8;
}
*{box-sizing:border-box}
html,body{margin:0;background:#061e31;color:white;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:14px}
.wrap{width:min(100%,420px)}
.stage{position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:24px;background:linear-gradient(#dff4ff 0 62%,#d8efd1 62%);box-shadow:0 20px 60px #0008}
svg{width:100%;height:100%;display:block}
.scene{opacity:0;pointer-events:none;transition:opacity .45s ease}
.scene.on{opacity:1}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.6);transition:.42s cubic-bezier(.2,.85,.25,1.2)}
.pop.on{opacity:1;transform:scale(1)}
.rise{opacity:0;transform:translateY(20px);transition:.48s ease}
.rise.on{opacity:1;transform:none}
.slide{opacity:0;transform:translateX(28px);transition:.5s ease}
.slide.on{opacity:1;transform:none}
.badge{opacity:0;transform:scale(1.5) rotate(-8deg);transform-box:fill-box;transform-origin:center;transition:.32s ease}
.badge.on{opacity:1;transform:scale(1) rotate(-4deg)}
.car{opacity:0}
.car.on{opacity:1}
.spark{opacity:0;transform-box:fill-box;transform-origin:center}
.spark.on{opacity:1;animation:spark .9s ease both}
@keyframes spark{0%{transform:scale(.2) rotate(-30deg)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* de tandarts wordt uit de dagketen gegooid */
.kicked{opacity:0!important;transform:translateY(90px) rotate(16deg)!important;
        transform-box:fill-box;transform-origin:center;
        transition:opacity .6s ease,transform .6s cubic-bezier(.5,-.45,.7,1)}

/* slapende auto bij het hotel */
@keyframes snooze{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#sleepCar.on{animation:snooze 2.4s ease-in-out infinite}
@keyframes floatZ{0%{opacity:0;transform:translate(0,0) scale(.7)}
                  30%{opacity:1}
                  100%{opacity:0;transform:translate(14px,-34px) scale(1.15)}}
.zz{opacity:0}
.zz.on text{animation:floatZ 2.6s ease-in-out infinite}
.zz.on text:nth-child(2){animation-delay:.8s}
.zz.on text:nth-child(3){animation-delay:1.6s}

/* ---- in-beeld overlay (lower third) ---- */
.lower{
  position:absolute;left:14px;right:14px;bottom:16px;
  background:rgba(0,47,80,.93);
  border-radius:16px;padding:13px 16px;
  min-height:62px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:14.5px;line-height:1.32;font-weight:700;color:#fff;
  box-shadow:0 10px 28px rgba(0,20,35,.35);
  border-left:5px solid var(--orange);
  transition:background .3s ease,color .3s ease,transform .3s cubic-bezier(.2,.85,.25,1.2),border-color .3s ease;
}
.lower span{transition:opacity .18s ease}
.lower.fade span{opacity:0}
/* nadruk: het hele vlak wordt oranje, geen donkere rand meer */
.lower.punch{
  background:var(--orange);color:#002F50;border-left-color:var(--orange);
  transform:scale(1.035);font-size:15.5px;
}
#cta{cursor:pointer}
#cta rect{transition:filter .2s ease}
#cta:hover rect{filter:brightness(1.08)}
.controls{display:flex;gap:10px;align-items:center;margin-top:10px}
.track{height:4px;flex:1;background:#ffffff33;border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--orange)}
button{border:0;border-radius:999px;background:var(--orange);color:#09243a;font-weight:800;padding:9px 15px;cursor:pointer}
.caption{display:none}
@media (prefers-reduced-motion:reduce){
  .pop,.rise,.slide,.badge{transition:opacity .15s linear;transform:none!important}
  *{animation:none!important}
}
</style>

<div class="controls"><button id="replay">Opnieuw</button><div class="track"><i id="prog"></i></div></div>
</div>
<script>
(()=>{
 const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
 const prog=q('#prog'), cap=q('#caption'), capText=q('#caption span'), replay=q('#replay');
 const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let raf=null,cursor=0,t0=0;

 // Kilometertarief 2026: EUR 0,25 (verhoogd van 0,23, terugwerkend tot 01-01-2026)
 const DAGTOTAAL=141.8;

 function show(sel){qa(sel).forEach(n=>n.classList.add('on'))}
 function hide(sel){qa(sel).forEach(n=>n.classList.remove('on'))}
 function say(t,emph){cap.classList.add('fade');setTimeout(()=>{capText.textContent=t;cap.classList.remove('fade');cap.classList.toggle('punch',!!emph)}, reduced?0:120)}
 function nl(n,d){return n.toFixed(d).replace('.',',')}

 // Laat een auto een pad rijden; telt optioneel de kilometers mee.
 function drive(pathSel,carSel,duration,counter){
   const path=q(pathSel), car=q(carSel), len=path.getTotalLength(); car.classList.add('on');
   const st=performance.now();
   (function step(now){
      let p=Math.min((now-st)/duration,1); let e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      let a=path.getPointAtLength(len*e), b=path.getPointAtLength(Math.min(len*e+2,len));
      let ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      car.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${ang})`);
      if(counter) q('#km').textContent=nl(DAGTOTAAL*e,1)+' km';
      if(p<1) requestAnimationFrame(step);
   })(st);
 }

 // Onthult de stippellijn van de volgende ochtend.
 function draw(pathSel,duration){
   const path=q(pathSel), len=path.getTotalLength();
   path.style.strokeDasharray='8 8'; path.style.strokeDashoffset=len;
   const st=performance.now();
   (function step(now){
     let p=Math.min((now-st)/duration,1);
     path.style.strokeDashoffset=len*(1-p);
     if(p<1) requestAnimationFrame(step);
   })(st);
 }

 const cues=[
  /* 1 · Mark */
  {t:0,on:'#s1,#mark',sub:'Dit is Mark. Zelfstandig, veel onderweg, en nog nooit een rittenstaat afgemaakt.'},
  {t:800,on:'#coffee'},
  {t:1300,on:'#phone'},
  {t:2400,on:'#bubble1',sub:'Zijn agenda staat al vol met afspraken en locaties.'},

  /* 2 · agenda's */
  {t:5200,off:'#s1',on:'#s2',sub:'RitSync brengt zijn agenda’s automatisch samen.'},
  {t:5700,on:'#cal1'}, {t:6100,on:'#cal2'}, {t:6500,on:'#cal3'},
  {t:7600,on:'#rsHub'}, {t:8500,on:'#spark2',sub:'De afspraken worden het vertrekpunt voor zijn ritten.'},

  /* 3 · dagketen, met kantoorbezoek tussendoor */
  {t:10500,off:'#s2',on:'#s3',sub:'Van huis naar kantoor, klanten, notaris en weer terug.'},
  {t:11000,on:'#pHome,#pOffice,#pRotterdam,#pAmsterdam,#pUtrecht,#counter'},
  {t:11900,run:()=>drive('#route','#car',reduced?700:8200,true),
           sub:'RitSync bouwt er één logische dagketen van en telt de kilometers.'},
  {t:13800,on:'#kantoorBadge',sub:'Om half een moet Mark nog even een dossier ophalen op kantoor.'},
  {t:15300,sub:'Die tussenstop wordt een schakel in de keten. Geen losse rit die je later niet meer kunt verantwoorden.',emph:true},
  {t:17400,on:'#pTandarts',sub:'En de tandarts probeert nog even mee te liften.'},
  {t:18600,on:'#tandKruis'},
  {t:19300,run:()=>q('#pTandarts').classList.add('kicked'),
           sub:'Maar privé blijft privé. Die kilometers worden niet eens berekend.',emph:true},
  {t:21000,sub:'Woon-werk gaat apart: zakelijk voor de inkomstenbelasting, privé voor de btw.'},

  /* 4 · classificatie */
  {t:23200,off:'#s3',on:'#s4',sub:'Zakelijk, intern, woon-werk of privé — RitSync deelt het zelf in.'},
  {t:23900,on:'#b1'}, {t:24350,on:'#b2'}, {t:24800,on:'#b3'},
  {t:25250,on:'#b4'}, {t:25700,on:'#b5'}, {t:26150,on:'#b6'},
  {t:26800,on:'#mark4',sub:'Mark hoeft niet één rit meer uit te zoeken.'},
  {t:28200,sub:'En de tandarts? Die doet twee keer pijn: die kilometers zijn óók niet aftrekbaar.',emph:true},

  /* 5 · overnachting */
  {t:30400,off:'#s4',on:'#s5',sub:'Woensdag rijdt Mark door naar Maastricht.'},
  {t:31000,on:'#p5home,#p5klant'},
  {t:31500,run:()=>drive('#route5','#car5',reduced?500:3200,false)},
  {t:34000,on:'#p5hotel',sub:'En hij rijdt niet terug.'},
  {t:35100,on:'#hotelScene,#sleepCar,#zz',sub:'De auto blijft staan. De dagketen sluit vandaag niet.'},
  {t:36800,on:'#p5keulen',run:()=>draw('#route5b',reduced?300:2000),
           sub:'Donderdag tien uur in Keulen. Daarna pas naar huis.',emph:true},
  {t:38600,sub:'De rit begint bij het hotel, niet bij zijn voordeur. Precies zoals het klopt.',emph:true},

  /* 6 · twijfel */
  {t:40800,off:'#s5',on:'#s6',sub:'En als iets écht niet duidelijk is, vraagt RitSync het gewoon.'},
  {t:41500,on:'#question'}, {t:42700,on:'#finger'},
  {t:43700,on:'#check5',run:()=>{q('#learnText').style.opacity='1'},
           sub:'Één tik. En de volgende keer weet RitSync het zelf.'},

  /* 7 · rapport */
  {t:45800,off:'#s6',on:'#s7',sub:'Aan het eind van de maand staat alles klaar.'},
  {t:46500,on:'#laptop'},
  {t:48000,on:'#privRow',sub:'Privé? Niet geregistreerd. RitSync weet niet waar je zaterdag was — en dat houden we graag zo.',emph:true},
  {t:50300,on:'#pdf'}, {t:50800,on:'#excel'}, {t:51300,on:'#csv',
           sub:'PDF voor de accountant, Excel voor jezelf, CSV voor de rest.'},
  {t:52700,on:'#mark7',sub:'Overzichtelijk, controleerbaar en klaar voor de aangifte.'},

  /* eind */
  {t:54700,off:'#s7',on:'#end',sub:''},{t:55200,on:'#endInner'}
 ];
 const DUR=58000;

 function reset(){
   qa('.scene,.pop,.rise,.slide,.badge,.spark,.zz').forEach(n=>n.classList.remove('on','kicked'));
   qa('.car').forEach(c=>{c.classList.remove('on');c.removeAttribute('transform')});
   q('#sleepCar').removeAttribute('transform');
   q('#km').textContent='0,0 km';
   const r5b=q('#route5b'); r5b.style.strokeDashoffset=r5b.getTotalLength();
   q('#learnText').style.opacity='0';capText.textContent='';cap.classList.remove('punch');prog.style.width='0';cursor=0;
 }
 function apply(c){if(c.off)hide(c.off);if(c.on)show(c.on);if(c.sub!==undefined)say(c.sub,c.emph);if(c.run)c.run()}
 function tick(now){
   const elapsed=now-t0;
   while(cursor<cues.length && cues[cursor].t<=elapsed) apply(cues[cursor++]);
   prog.style.width=Math.min(elapsed/DUR*100,100)+'%';
   if(elapsed<DUR) raf=requestAnimationFrame(tick);
 }
 function play(){if(raf)cancelAnimationFrame(raf);reset();t0=performance.now();raf=requestAnimationFrame(tick)}
 replay.addEventListener('click',play); play();
})();
</script>
