<style>
/* ============================================================
   RitSync tekenfilm v7 — "De werkdag van Mark" · ca. 63 sec

   Opzet volgens de vijf verbeterpunten van Wim (26-08-2026):
   - doorlopende vertelstem (zes fragmenten, assets/shot1..shot6.mp3)
   - Mark als hoofdpersoon: ochtend -> ritten -> avond klaar
   - hoogtepunt: agenda-afspraak vliegt uit de agenda en wordt
     een rit op de kaart (scène 2)
   - vrijwel geen tekst in beeld; alleen kreten
     (AGENDA -> RIT · PRIVÉ · ZAKELIJK · 141,8 KM · KLAAR)
   - slot: eindkaart met testeroproep (stem) en registratieknop

   Muziek: assets/road-trip-music-sonican.mp3, zacht onder de
   stem (Web Audio-gain; iPhone-proof zoals v6).
   Alle timing staat in de cues-array onderaan.
   ============================================================ */
:root{
  --navy:#002F50;--navy2:#064a78;--orange:#ff8b00;--green:#19a05b;
  --red:#df4a4a;--blue:#2e73c8;--ink:#17324a;--muted:#6e7f8f;
}
*{box-sizing:border-box}
html,body{margin:0;background:#061e31;color:white;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:14px}
.wrap{width:min(100%,420px)}
.stage{position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:24px;background:linear-gradient(#dff4ff 0 62%,#d8efd1 62%);box-shadow:0 20px 60px #0008}
svg{width:100%;height:100%;display:block}
.scene{opacity:0;pointer-events:none;transition:opacity .5s ease}
.scene.on{opacity:1;pointer-events:auto}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.6);transition:.42s cubic-bezier(.2,.85,.25,1.2)}
.pop.on{opacity:1;transform:scale(1)}
.rise{opacity:0;transform:translateY(20px);transition:.48s ease}
.rise.on{opacity:1;transform:none}
.badge{opacity:0;transform:scale(1.5) rotate(-8deg);transform-box:fill-box;transform-origin:center;transition:.32s ease}
.badge.on{opacity:1;transform:scale(1) rotate(-4deg)}
.car{opacity:0}
.car.on{opacity:1}

/* vliegende agenda-chips: de kern van scène 2 */
.chip{transform-box:fill-box;transform-origin:center;transition:transform 1.1s cubic-bezier(.35,.7,.3,1), opacity .35s ease .85s}
/* agenda-regel die "gebruikt" is */
.agrow{transition:opacity .5s ease}
.agrow.used{opacity:.3}
/* tandarts wordt van de kaart gestuiterd */
.kicked{opacity:0!important;transform:translate(70px,120px) rotate(18deg)!important;
        transform-box:fill-box;transform-origin:center;
        transition:opacity .65s ease,transform .65s cubic-bezier(.5,-.45,.7,1)}
/* kilometerteller-nadruk (141,8 KM) */
#counterBox rect{transition:fill .35s ease}
#counterBox text{transition:fill .35s ease}
#counterBox.emph rect{fill:#ff8b00}
#counterBox.emph #kmLabel{fill:#5c3300}
#counterBox.emph #km{fill:#002F50}
/* laptop klapt dicht */
#lid{transform-box:fill-box;transform-origin:center bottom;transition:transform 1s cubic-bezier(.4,0,.6,1)}
#lid.closed{transform:scaleY(.07)}

#cta{cursor:pointer}
#cta rect{transition:filter .2s ease}
#cta:hover rect{filter:brightness(1.08)}
.controls{display:flex;gap:10px;align-items:center;margin-top:10px}
.track{height:4px;flex:1;background:#ffffff33;border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--orange)}
button{border:0;border-radius:999px;background:var(--orange);color:#09243a;font-weight:800;padding:9px 15px;cursor:pointer}

.startover{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(0,25,42,.55);backdrop-filter:blur(2px);
  transition:opacity .35s ease;
}
.startover.hidden{opacity:0;pointer-events:none}
.startover button{font-size:16px;padding:14px 28px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.startover span{font-size:12.5px;font-weight:600;color:#cfe3f2}
@media (prefers-reduced-motion:reduce){
  .pop,.rise,.badge,.chip{transition:opacity .15s linear;transform:none!important}
  *{animation:none!important}
}
</style>
</head>

<script>
(()=>{
 const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
 const prog=q('#prog'), replay=q('#replay');
 const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let raf=null,cursor=0,t0=0;

 // ---- audio ----
 const music=q('#musicTrack');
 const vo=[q('#vo1'),q('#vo2'),q('#vo3'),q('#vo4'),q('#vo5'),q('#vo6')];
 const overlay=q('#startOverlay'), startBtn=q('#startBtn');
 let musicRaf=null, actx=null, gain=null, curVol=0;

 function ensureAudioGraph(){
   if(actx){actx.resume&&actx.resume();return}
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;
   try{
     actx=new AC();
     const src=actx.createMediaElementSource(music);
     gain=actx.createGain(); gain.gain.value=0;
     src.connect(gain); gain.connect(actx.destination);
     music.volume=1;
   }catch(e){actx=null;gain=null}
 }
 function setVol(v){
   curVol=Math.max(0,Math.min(1,v));
   if(gain){gain.gain.value=curVol}else{music.volume=curVol}
 }
 function unlockAudio(){
   [...vo,music].forEach(a=>{
     try{const p=a.play();if(p&&p.catch)p.catch(()=>{});a.pause();a.currentTime=0;}catch(e){}
   });
 }
 function musicTo(target,ms){
   if(musicRaf)cancelAnimationFrame(musicRaf);
   const from=curVol, st=performance.now();
   (function step(now){
     const p=Math.min((now-st)/ms,1);
     setVol(from+(target-from)*p);
     if(p<1) musicRaf=requestAnimationFrame(step);
   })(st);
 }

 function show(sel){qa(sel).forEach(n=>n.classList.add('on'))}
 function hide(sel){qa(sel).forEach(n=>n.classList.remove('on'))}
 function nl(n,d){return n.toFixed(d).replace('.',',')}

 // Auto rijdt een pad; het pad tekent zichzelf mee; de teller telt van kmA naar kmB.
 function drive(pathSel,duration,kmA,kmB){
   const path=q(pathSel), car=q('#car'), len=path.getTotalLength();
   path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
   car.classList.add('on');
   const st=performance.now();
   (function step(now){
      let p=Math.min((now-st)/duration,1); let e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      path.style.strokeDashoffset=len*(1-e);
      let a=path.getPointAtLength(len*e), b=path.getPointAtLength(Math.min(len*e+2,len));
      let ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      car.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${ang})`);
      q('#km').textContent=nl(kmA+(kmB-kmA)*e,1)+' km';
      if(p<1) requestAnimationFrame(step);
   })(st);
 }

 // Chip vliegt van agendaregel naar bestemming (dx,dy in px).
 function fly(sel,dx,dy,scale,fade){
   const el=q(sel);
   el.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`;
   if(fade)el.style.opacity='0';
 }

 const cues=[
  /* ── SHOT 1 · ochtend (stem: "Dit is Mark...") ── */
  {t:0,on:'#s1,#mark1',run:()=>{vo[0].play();setVol(0);music.play();musicTo(.12,2500)}},
  {t:1200,on:'#coffee1'},
  {t:2200,on:'#phone1'},

  /* ── SHOT 2 · agenda wordt rit (stem: "Kijk — elke afspraak...") ── */
  {t:6500,off:'#s1',on:'#s2'},
  {t:6900,on:'#pinT,#counterBox'},
  {t:7000,run:()=>vo[1].play()},

  {t:13100,on:'#pinA'},
  {t:13400,run:()=>drive('#p2',reduced?500:3000,43.7,91.2)},
  {t:17000,run:()=>musicTo(.25,1200)},

  /* ── SHOT 3 · privé eruit (stem: "Zakelijk is zakelijk...") ── */

  {t:20300,run:()=>vo[2].play()},

  /* ── SHOT 4 · de dag rijgt zich (stem: "Tussenstop, klant, notaris...") ── */

  {t:30000,run:()=>drive('#p3',reduced?700:7500,91.2,141.8)},

  /* ── SHOT 6 · eindkaart (stem: testeroproep) ── */

  {t:52500,on:'#ctaWrap'},

  /* uitloop: stem klaar (±58 s), muziek even terug en uitfaden */
  {t:58600,run:()=>musicTo(.25,1500)},
  {t:61000,run:()=>musicTo(0,2500)}
 ];
 const DUR=63500;

 function reset(){
   qa('.scene,.pop,.rise,.badge').forEach(n=>n.classList.remove('on'));
   qa('.chip').forEach(c=>{c.classList.remove('kicked');c.style.transform='';c.style.opacity=''});
   qa('.agrow').forEach(r=>r.classList.remove('used'));
   q('#car').classList.remove('on');q('#car').removeAttribute('transform');
   q('#lid').classList.remove('closed');
   q('#counterBox').classList.remove('emph');
   ['#p1','#p2','#p3'].forEach(s=>{const p=q(s);const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len});
   q('#km').textContent='0,0 km';
   prog.style.width='0';cursor=0;
   if(musicRaf)cancelAnimationFrame(musicRaf);
   [...vo,music].forEach(a=>{a.pause();a.currentTime=0});
   setVol(0);
 }
 function apply(c){if(c.off)hide(c.off);if(c.on)show(c.on);if(c.run)c.run()}
 function tick(now){
   const elapsed=now-t0;
   while(cursor<cues.length && cues[cursor].t<=elapsed) apply(cues[cursor++]);
   prog.style.width=Math.min(elapsed/DUR*100,100)+'%';
   if(elapsed<DUR) raf=requestAnimationFrame(tick);
 }
 function play(){if(raf)cancelAnimationFrame(raf);reset();t0=performance.now();raf=requestAnimationFrame(tick)}
 startBtn.addEventListener('click',()=>{
   ensureAudioGraph(); unlockAudio();
   overlay.classList.add('hidden'); play();
 });
 replay.addEventListener('click',()=>{
   ensureAudioGraph(); unlockAudio(); play();
 });
})();
</script>
